name: Import verified VK assets
on:
  push:
    paths:
      - '.github/workflows/import-assets.yml'
      - 'scripts/import-assets.py'
  workflow_dispatch:
concurrency:
  group: import-amur-assets
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - run: python3 -u scripts/import-assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amur-verified-assets
          path: |
            assets/
            source-details/
          retention-days: 3
      - name: Save optimized source-verified photographs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m 'assets: add optimized photographs from Amur VK publications'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
