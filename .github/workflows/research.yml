name: Collect public salon sources
on:
  push:
    paths:
      - '.github/workflows/research.yml'
      - 'scripts/collect-sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read publicly accessible VK source material
        run: python3 scripts/collect-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: amur-source-research
          path: source-research/
          retention-days: 3
          if-no-files-found: error
