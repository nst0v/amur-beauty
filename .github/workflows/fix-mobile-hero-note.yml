name: Fix mobile hero note
on:
  push:
    paths:
      - 'scripts/fix-mobile-hero-note.py'
      - '.github/workflows/fix-mobile-hero-note.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-mobile-hero-note.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'fix: move mobile working-hours card above hero image'
          git pull --rebase origin main
          git push origin HEAD:main
