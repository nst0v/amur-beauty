name: Verify booking data and calendar
on:
  push:
    paths: ['scripts/enrich-booking-catalog.py', 'tests/probe_live_widget.py', '.github/workflows/verify-booking-data.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amur-full-catalog
          run-id: 34319658586
          github-token: ${{ github.token }}
      - run: python3 -m pip install beautifulsoup4 Pillow playwright
      - run: python3 -u scripts/enrich-booking-catalog.py
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 -u tests/probe_live_widget.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amur-verified-booking
          path: |
            data/
            assets/team/
            widget-probe/
          retention-days: 1
          if-no-files-found: error
      - name: Save verified public catalog and portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json assets/team/
          if ! git diff --staged --quiet; then
            git commit -m 'content: add all 44 services, seven specialists and verified individual offerings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
