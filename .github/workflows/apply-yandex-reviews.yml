name: Apply Yandex reviews
on:
  push:
    paths:
      - 'scripts/use-yandex-reviews.py'
      - '.github/workflows/apply-yandex-reviews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/use-yandex-reviews.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          git commit -m 'content: use Yandex rating and generic online booking wording'
          git pull --rebase origin main
          git push origin HEAD:main
