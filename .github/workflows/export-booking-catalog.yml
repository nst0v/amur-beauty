name: Export full booking catalog
on:
  push:
    paths: ['scripts/export-booking-catalog.py', '.github/workflows/export-booking-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4 Pillow
      - run: python3 -u scripts/export-booking-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amur-full-catalog
          path: |
            data/
            assets/team/
            catalog-research/
          retention-days: 1
          if-no-files-found: error
